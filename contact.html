<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Areen Store | تواصل معنا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
   <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Great+Vibes&family=Tajawal:wght@400;500;700&display=swap"
    rel="stylesheet">
            <link rel="stylesheet" href="css/style.css">

</head>
<body class="font-[Tajawal] font-normal">   

<div class="head"></div>
    <div id="contact" class="page  pt-32 p-6 bg-gradient-to-b from-fuchsia-50/30 via-fuchsia-200/20 to-white ">
        <div class="flex flex-col justify-center items-center space-y-5 p-4">
            <p class="text-gray-600 tracking-[3px]">Areen Store</p>
            <h1 class="font-bold text-purple-950 text-6xl">تواصل معنا</h1>
            <p class="text-gray-500  mt-2 leading-[30px] text-xl">نحن هنا لسماعك — أخبرنا كيف يمكننا مساعدتك.</p>
        </div>
        <div class="grid md:grid-cols-2 gap-7 lg:px-20">
            <div class="bg-white rounded-3xl flex flex-col  p-6 mt-10">
                <p class="text-xl mb-1">الاسم</p>
                <input type="text" name="" id="" class="bg-purple-100/50 rounded-[50px] p-2 text-xl mb-5">
                <p class="text-xl mb-1">البريد الالكتروني</p>
                <input type="email" name="" id="" class="bg-purple-100/50 rounded-[50px] p-2 text-xl mb-5">
                <p class="text-xl mb-1">الرسالة</p>
                <textarea name="" id="" class="bg-purple-100/50 rounded-[50px] p-2 text-xl mb-5"></textarea>
                <input type="button" class="bg-purple-950 w-40 h-10 text-white text-xl rounded-2xl"
                    value="ارسل الرسالة">
            </div>
            <div class="flex flex-col space-y-4 mt-10">
                <div
                    class="bg-white shadow-md shadow-black/30 rounded-3xl p-2 flex gap-3 hover:shadow-lg transition duration-300">
                    <div class="w-14 h-14 bg-fuchsia-300/30 rounded-full p-3 flex"><i
                            class="fa-solid fa-phone m-auto text-xl"></i></div>
                    <div>
                        <p class="text-gray-600 text-lg">الهاتف</p>
                        <h1 class="text-xl tracking-widest">056-950-6109</h1>
                    </div>
                </div>

                <a href="https://wa.me/972569506109"
                    class="bg-white shadow-md shadow-black/30 rounded-3xl p-2 flex gap-3 hover:shadow-lg transition duration-300">
                    <div
                        class="w-14 h-14 justify-center items-center text-green-500 text-center bg-fuchsia-300/30 rounded-full flex ">
                        <i class="fa-brands fa-whatsapp p-4  text-2xl"></i>
                    </div>
                    <div>
                        <p class="text-gray-600 text-lg">واتساب</p>
                        <h1 class="text-xl tracking-widest">056-950-6109</h1>
                    </div>
                </a>
                <div
                    class="bg-white shadow-md shadow-black/30 rounded-3xl p-2 flex gap-3 hover:shadow-lg transition duration-300">
                    <div class="w-14 h-14 text-center bg-fuchsia-300/30 rounded-full flex size-15"><i
                            class="fa-solid fa-location-dot p-4 m-auto text-xl"></i></div>
                    <div>
                        <p class="text-gray-600 text-lg">الموقع</p>
                        <h1 class="text-xl tracking-widest">فلسطين</h1>
                    </div>
                </div>
            </div>
        </div>
    </div>

  <div class="footer"></div>
               <script src="js/footer.js"></script>
            <script src="js/headr.js"></script>

        <script src="js/scrept.js"></script>
</body>
</html>
