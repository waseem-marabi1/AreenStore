<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Areen Store | login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Parastoo:wght@400..700&display=swap"
        rel="stylesheet">
</head>

<div>
    <div class=" h-screen flex justify-center items-center flex-col text-center ">
        <img src="img/loginimg.png" class="lg:hidden bg-cover h-screen w-screen " alt="">
        <img src="img/loginimgpc.png" class="hidden lg:block bg-cover h-screen w-screen  " alt="">

        <div class="p-7 md:10 shadow-lg shadow-gray-600/50 border-gray-500  absolute bg-white space-y-3 rounded-3xl">
            <h1 class="text-4xl lg:text-6xl font-extrabold text-purple-950 tracking-wide"> تسجيل الدخول</h1>

            <p class="text-gray-500 md:text-lg">مرحباً بعودتك ,قم بتسجيل الدخول لحسابك </p>
            <div>
                <form action="" class="flex flex-col space-y-3">
                    <div class="relative">
                        <input id="username" type="username" placeholder="اسم المستخدم" class="w-full h-12 border border-gray-300 rounded-xl pr-10 pl-3 
           focus:outline-none focus:ring-2 focus:ring-purple-900 
           focus:border-purple-900 transition" >
                        <i class="fa-regular fa-circle-user absolute right-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    </div>
                    <div class="relative">
                        <input id="password"  type="password"     autocomplete="current-password"
 placeholder="كلمة المرور" 
                        class="w-full h-12 border border-gray-300 rounded-xl pr-10 pl-3 
           focus:outline-none focus:ring-2 focus:ring-purple-900 
           focus:border-purple-900 transition" >
                        <i class="fa-solid fa-lock absolute right-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    </div>
                    <div class="flex justify-between">
                        <p class="text-purple-600 text-bold">نسيت كلمة المرور ؟</p>
                        <div class="flex gap-2">
                            <p class="text-gray-500">تذكرني</p>
                            <input type="checkbox" name="" id="">
                        </div>

                    </div>
                    <input id="loginbtn" type="button" value="تسجيل الدخول"
                        class="cursor-pointer hover:bg-purple-950/90 bg-purple-950 w-full h-10 text-white flex rounded-2xl text-xl items-center justify-center"
                        >
                </form>
                  <div class="flex">
                    <div class="bg-purple-400/70 w-9 md:w-16 h-0.5 m-auto"></div>
                <p class="my-4 text-gray-500">تسجيل الدخول باستخدام </p>
                    <div class="bg-purple-400/70 w-9 md:w-16 h-0.5 m-auto"></div>
                </div>
                <div class="flex justify-center gap-3 mb-4">
                    <div
                        class="w-[50px] h-[30px] border-2 border-gray-200 flex items-center justify-center text-center text-xl rounded-xl text-red-400">
                        <i class="fa-brands fa-google"></i>
                    </div>
                    <div
                        class="w-[50px] h-[30px] border-2 border-gray-200 flex items-center justify-center text-center text-xl rounded-xl text-blue-500">
                        <i class="fa-brands fa-facebook"></i>
                    </div>
                    <div
                        class="w-[50px] h-[30px] border-2 border-gray-200 flex items-center justify-center text-center text-xl rounded-xl">
                        <i class="fa-brands fa-apple"></i>
                    </div>
                </div>
                <p>ليس لديك حساب ؟ <a href="register.html" class="text-purple-800 text-bold">انشاء حساب</a></p>
               <a href="index.html" class="inline-flex  justify-center   "><p class="text-lg">تخطي </p><i class="text-sm fa-solid fa-arrow-left mt-auto mr-2 "></i></a>
                
            </div>
        </div>
    </div>


</div>
<script src="login.js"></script>
<body style='font-family: "Parastoo", "Aref Ruqaa", serif; '>
</body>

</html>
