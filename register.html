<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Areen Store | Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Parastoo:wght@400..700&display=swap"
        rel="stylesheet">
</head>

<div>
    <div class=" h-screen flex justify-center items-center flex-col text-center ">
        <img src="img/registerimg.png" class="lg:hidden bg-cover h-screen w-screen " alt="">
        <img src="img/registerimgpc.png" class="hidden lg:block bg-cover h-screen w-screen  " alt="">

        <div class="p-7 md:10  absolute  space-y-3 rounded-3xl">
            <h1 class="text-4xl lg:text-6xl font-extrabold text-purple-950 tracking-wide"> انشاء حساب جديد </h1>

            <p class="text-gray-500 md:text-lg">انضم الينا اليوم وابدأ رحلة التسوق</p>
            <div>
                <form action="" class="flex flex-col space-y-3">

                    <div class="relative">
                        <input id="username" type="username" placeholder="اسم المستخدم" class="w-full h-12 border border-gray-300 rounded-xl pr-10 pl-3 
           focus:outline-none focus:ring-2 focus:ring-purple-900 
           focus:border-purple-900 transition">
                        <i
                            class="fa-regular fa-circle-user absolute right-3 top-1/2 -translate-y-1/2 text-gray-500"></i>

                    </div>
                    <div class="relative">
                        <input id="email" type="email" placeholder="البريد الالكتروني " class="w-full h-12 border border-gray-300 rounded-xl pr-10 pl-3 
           focus:outline-none focus:ring-2 focus:ring-purple-900 
           focus:border-purple-900 transition">
                        <i class="fa-regular fa-envelope absolute right-3 top-1/2 -translate-y-1/2 text-gray-500"></i>

                    </div>
                    <div class="relative">
                        <input id="password" type="password"     autocomplete="new-password"
 placeholder=" كلمة المرور" class="w-full h-12 border border-gray-300 rounded-xl pr-10 pl-3 
           focus:outline-none focus:ring-2 focus:ring-purple-900 
           focus:border-purple-900 transition">
                        <i class="fa-solid fa-lock absolute right-3 top-1/2 -translate-y-1/2 text-gray-500"></i>

                    </div>
                    <div class="relative">
                        <input id="configpassword" type="password"     autocomplete="new-password"
 placeholder=" تأكيد كلمة المرور" class="w-full h-12 border border-gray-300 rounded-xl pr-10 pl-3 
           focus:outline-none focus:ring-2 focus:ring-purple-900 
           focus:border-purple-900 transition">
                        <i class="fa-solid fa-lock absolute right-3 top-1/2 -translate-y-1/2 text-gray-500"></i>

                    </div>

                    <input id="registerbtn" type="button" value=" انشاء حساب"
                        class="cursor-pointer hover:bg-purple-950/90 bg-purple-950 w-full h-10 text-white flex rounded-2xl text-xl items-center justify-center">
                </form>
                <div class="flex">
                    <div class="bg-purple-400/70 w-9 md:w-20 h-0.5 m-auto"></div>
                    <p class="my-4 text-gray-500"> او انشاء حساب باستخدام </p>
                    <div class="bg-purple-400/70 w-9 md:w-20 h-0.5 m-auto"></div>
                </div>
                <div class="flex justify-center gap-3 mb-4">
                    <div
                        class="w-[50px] h-[30px] border-2 border-gray-200 flex items-center justify-center text-center text-xl rounded-xl text-red-400">
                        <i class="fa-brands fa-google"></i>
                    </div>
                    <div
                        class="w-[50px] h-[30px] border-2 border-gray-200 flex items-center justify-center text-center text-xl rounded-xl text-blue-500">
                        <i class="fa-brands fa-facebook"></i>
                    </div>
                    <div
                        class="w-[50px] h-[30px] border-2 border-gray-200 flex items-center justify-center text-center text-xl rounded-xl">
                        <i class="fa-brands fa-apple"></i>
                    </div>
                </div>
                <p>لديك حساب بالفعل ؟ <a href="login.html" class="text-purple-800 text-bold ">تسجيل الدخول</a></p>
            </div>
        </div>
    </div>


</div>
<script src="register.js"></script>

<body style='font-family: "Parastoo", "Aref Ruqaa", serif; '>
</body>

</html>
