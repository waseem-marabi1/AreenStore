<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Areen Store | المتجر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Great+Vibes&family=Tajawal:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<!--  -->

<body class="font-[Tajawal] font-normal ">
   
    <div class="head"></div>

    <div id="shop" class="page  pt-20 p-2 bg-gradient-to-b from-purple-100/20 via-purple-100 to-white ">
        <div class="flex flex-col justify-center items-center pt-16 ">
            <p class="text-gray-600 tracking-[3px]">Areen Store</p>
            <h1 class="font-bold text-purple-950 text-6xl   ">المتجر</h1>
            <p class="text-gray-600  mt-2">مجموعة مختارة بعناية من الورد والهدايا الفاخرة لكل المناسبات</p>
        </div>
        <div class=" flex flex-wrap gap-2 items-center justify-center py-7">
            <button id="allp" onclick="btnCategory( 'all'  , this)"
                class=" thecolorJS  bg-purple-100 rounded-[20px] py-1 px-3 cursor-pointer  font-medium text-purple-900 text-lg">الكل</button>
            <button id="satanp" onclick="btnCategory('satan',this)"
                class="thecolorJS bg-purple-100 rounded-[20px] py-1 px-3 cursor-pointer font-medium text-purple-900 text-lg">باقات
                الستان</button>
            <button id="Artificialp" onclick="btnCategory('Artificial',this)"
                class=" thecolorJS bg-purple-100 rounded-[20px] py-1 px-3 cursor-pointer  font-medium text-purple-900 text-lg">باقات
                الورد الصناعي</button>
            <button id="accessoriesp" onclick="btnCategory('accessories',this)"
                class=" thecolorJS bg-purple-100 rounded-[20px] py-1 px-3 cursor-pointer  font-medium text-purple-900 text-lg">الاكسسوارات</button>
            <button onclick="btnCategory('Flowerbox',this)"
                class=" thecolorJS bg-purple-100 rounded-[20px] py-1 px-3 cursor-pointer font-medium text-purple-900 text-lg">بوكس ورد
                </button>
            <button onclick="btnCategory('Bridalbouquet',this)"
                class=" thecolorJS bg-purple-100 rounded-[20px] py-1 px-3 cursor-pointer  font-medium text-purple-900 text-lg"> مسكات 
                </button>
            <button id="giftsp" onclick="btnCategory('gifts',this)"
                class=" thecolorJS bg-purple-100 rounded-[20px] py-1 px-3 cursor-pointer font-medium text-purple-900 text-lg">باقات
                الهدايا</button>
            <button id="Printedgiftsp" onclick="btnCategory('Printedgifts',this)"
                class=" thecolorJS bg-purple-100 rounded-[20px] py-1 px-3 cursor-pointer  font-medium text-purple-900 text-lg">هدايا
                الطباعة</button>
            <button id="Graduationp" onclick="btnCategory('Graduation',this)"
                class=" thecolorJS bg-purple-100 rounded-[20px] py-1 px-3 cursor-pointer  font-medium text-purple-900 text-lg">مجموعة
                التخرج</button>
            <button id="giftmom" onclick="btnCategory('giftmom',this)"
                class=" thecolorJS bg-purple-100 rounded-[20px] py-1 px-3 cursor-pointer  font-medium text-purple-900 text-lg">هدايا الام </button>
        </div>
        <div class=" p-2 lg:px-20">
            <!-- البحث -->
            <div class="flex flex-col-reverse md:flex-row md:justify-between py-5 lg:px-10 space-y-3">
                <button
                    class="bg-purple-700 py-1 md:px-12 mt-3 text-white font-medium text-xl rounded-xl">Search</button>
                <input class=" px-4 md:w-[400px] lg:w-[700px] focus:border-2 border-purple-500/50 outline-none text-lg "
                    dir="ltr" type="search" name="" id="search" placeholder="search">
                <select id="searchType" dir="ltr" name="" id="" class="px-3 py-2 border border-gray-400 rounded-md">
                    <option value="Name">Search by Product name</option>
                    <option value="Price">Search by price</option>
                </select>
            </div>
            <!-- المنتجاات  -->
            <div id="allproduct" class="w-full grid grid-cols-2 gap-4 md:grid-cols-3 lg:grid-cols-4  "> </div>
        </div>
    </div>



    <div class="footer"></div>
    <script src="js/footer.js"></script>

    <script src="js/headr.js"></script>
    <script src="js/scrept.js"></script>
</body>

</html>
